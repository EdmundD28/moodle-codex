name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/moodle-codex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/moodle-codex/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  setup-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the exact double-click launcher through Windows PowerShell
        shell: cmd
        run: plugins\moodle-codex\Setup-Moodle.cmd -SelfTest
